name: Publish library

# Create a GitHub Release with a tag like v1.0.0 -> publishes com.gcl:gamechiefads-*:1.0.0
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable (web uploads drop the permission)
        run: chmod +x ./gradlew

      - name: Publish to GitHub Packages
        run: ./gradlew :gamechiefads-core:publishReleasePublicationToGitHubPackagesRepository :gamechiefads-ui:publishReleasePublicationToGitHubPackagesRepository --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
